name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node 🧱
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create .env file
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}" >> .env
          echo "VITE_APP_BASE_URL=${{ secrets.VITE_APP_BASE_URL }}" >> .env
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env

      - name: Install dependencies 📦
        run: npm ci

      # Quality gates. GitHub Actions stops the job on the first failing step,
      # so the Deploy step below never runs if a blocking gate fails.
      - name: Type check 🔎
        run: npm run type-check

      # Lint is REPORT-ONLY for now, deliberately.
      #
      # Repairing eslint.config.ts (it never registered a TypeScript parser, so
      # 425 of 426 results were "Parsing error") turned the linter on for the
      # first time in this repo's history. It immediately surfaced 604 genuine
      # violations, 577 of them no-unused-vars.
      #
      # Making that blocking today would leave the pipeline permanently red and
      # nothing would ever deploy again — and a always-red pipeline is ignored,
      # which is worse than no pipeline. So it reports, and does not block.
      #
      # These are NOT to be bulk-autofixed: an unused variable here can mean a
      # value was computed and the code forgot to use it. NotaEditor.vue:952 is
      # exactly that, and it is a live data-loss bug.
      #
      # Flip continue-on-error to false once the backlog reaches zero.
      - name: Lint 🧹 (report-only — see comment above)
        run: npx eslint .
        continue-on-error: true

      - name: Unit tests 🧪
        run: npx vitest run

      - name: Build 🔧
        run: npm run build-only

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
