name: Deploy to GitHub Pages

# Deploy runs ONLY after the Quality workflow (ci.yml) concludes successfully on
# master. The quality gates (type-check, lint, unit tests, build, size budget)
# live in ci.yml now; this workflow no longer runs them itself and no longer
# uses `build-only` to bypass type-check — it builds with `npm run build`, which
# type-checks as part of the build. If the Quality workflow fails, `workflow_run`
# still fires but the job's `if:` guard skips the deploy, so a red gate never
# ships.
on:
  workflow_run:
    workflows: ["Quality"]
    types:
      - completed
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    # Deploy only when the Quality workflow passed.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node 🧱
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Create .env file
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
          echo "VITE_FIREBASE_MEASUREMENT_ID=${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}" >> .env
          echo "VITE_APP_BASE_URL=${{ secrets.VITE_APP_BASE_URL }}" >> .env
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env

      - name: Install dependencies 📦
        run: npm ci

      # `npm run build` runs type-check + build (not `build-only`), so the deploy
      # build no longer bypasses type-check.
      - name: Build 🔧
        run: npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
