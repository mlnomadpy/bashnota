name: Quality

# Full quality gate — type-check, lint, unit tests, production build and the
# entry-chunk size budget. Runs on every push to master and every pull request.
#
# This workflow is INDEPENDENT of Deploy (deploy.yml): it neither deploys nor
# needs any deploy secret, so it also runs green on pull requests (including
# forks). Deploy is wired to run only after this workflow concludes success on
# master (see deploy.yml's `workflow_run` trigger), so a red quality gate keeps
# a broken master from shipping.

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

      # Each gate below is its own named step and fails the job on errors.
      - name: Type check
        run: npm run type-check

      - name: Enforce sole-backend boundary
        run: npm run check:backend-purity

      - name: Enforce repository and environment hygiene
        run: npm run check:repository-hygiene

      - name: Verify production deploy gate
        run: node scripts/check-supabase-deploy-config.self-test.mjs

      - name: Verify deploy workflow pins the tested commit
        run: npm run test:deploy-workflow

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:fast

      - name: Enforce critical service and store coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      - name: Critical nota workflow E2E
        run: npm run test:playwright

      - name: Production PWA lifecycle E2E
        run: npm run test:pwa

      - name: Generated export browser security
        run: npm run test:export-security

      - name: Token-authenticated Jupyter browser security
        run: npm run test:jupyter-security

      # Upload the vitest results even when the test step failed, so a red run
      # still leaves the report attached to the job.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: |
            test-results/vitest-junit.xml
            test-results/playwright-junit.xml
            test-results/pwa-junit.xml
          if-no-files-found: error

      - name: Build
        run: npm run build

      - name: Enforce initial route asset graph budget
        run: npm run test:initial-route-assets

      - name: Production container smoke test
        run: npm run test:container
