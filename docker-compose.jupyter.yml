services:
  jupyter:
    image: quay.io/jupyter/minimal-notebook@sha256:88ace6b9545560715b66e7e4ff69dec787afb72cc69f17fe18eeb0b23d04a26a
    ports:
      - "127.0.0.1:8888:8888"
    command:
      - start-notebook.py
      - --ServerApp.token=
      - --ServerApp.password=
      - --ServerApp.allow_origin=http://127.0.0.1:5173
      - --ServerApp.allow_credentials=True
      - --ServerApp.disable_check_xsrf=True
    volumes:
      - bashnota-jupyter-work:/home/jovyan/work
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/api/kernelspecs', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  bashnota-jupyter-work:
